# gitleaks' configuration for the conventions step (eval/conventions.sh). Read-only to every builder.
#
# gitleaks' own default rules, unchanged. The file exists so that the step can name it with
# --config: without it, gitleaks reads a .gitleaks.toml from the folder it scans, and a builder's
# allowlist there would switch the scan off.
[extend]
useDefault = true
